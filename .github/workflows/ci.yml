name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.428

      - name: Install Electron dependencies
        working-directory: electron-app
        run: npm ci

      - name: Run TypeScript checks
        working-directory: electron-app
        run: npm run typecheck

      - name: Run backend tests
        working-directory: electron-app
        run: npm run test:backend

      - name: Run renderer smoke harness
        working-directory: electron-app
        run: npm run test:renderer-smoke:harness

      - name: Test staged DLL workflow
        shell: powershell
        run: ./scripts/test-staged-dll-workflow.ps1

      - name: Test updater rollback
        shell: pwsh
        run: ./scripts/test-updater-rollback.ps1

      - name: Build and verify release payload
        shell: pwsh
        run: ./scripts/build-and-verify-release.ps1

      - name: Upload main build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: longyin-main-${{ github.sha }}
          path: |
            electron-app/release/LongYinProMaxApp-*-win-x64.zip
            electron-app/release/update-manifest.json
          if-no-files-found: error
          retention-days: 7
