name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release source and version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/assert-release-source.ps1 -TagName $env:RELEASE_TAG

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.428

      - name: Install Electron dependencies
        working-directory: electron-app
        run: npm ci

      - name: Run release tests
        working-directory: electron-app
        run: |
          npm run typecheck
          npm run test:backend
          npm run test:renderer-smoke:harness

      - name: Test staged DLL workflow
        shell: powershell
        run: ./scripts/test-staged-dll-workflow.ps1

      - name: Test updater rollback
        shell: pwsh
        run: ./scripts/test-updater-rollback.ps1

      - name: Build and verify release payload
        shell: pwsh
        run: ./scripts/build-and-verify-release.ps1

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            electron-app/release/LongYinProMaxApp-*-win-x64.zip
            electron-app/release/update-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Verify GitHub CLI availability
        shell: pwsh
        run: gh --version

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-release-assets.ps1 -TagName $env:RELEASE_TAG -AssetsRoot ./release-assets
