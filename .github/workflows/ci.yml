name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 6.0.428

      - name: Install Electron dependencies
        working-directory: electron-app
        run: npm ci

      - name: Run TypeScript checks
        working-directory: electron-app
        run: npm run typecheck

      - name: Run backend tests
        working-directory: electron-app
        run: npm run test:backend

      - name: Run renderer smoke harness
        working-directory: electron-app
        run: npm run test:renderer-smoke:harness

      - name: Test release notes policy
        shell: pwsh
        run: |
          ./scripts/test-release-notes-policy.ps1
          $version = (Get-Content -Raw ./electron-app/package.json | ConvertFrom-Json).version
          ./scripts/get-release-notes.ps1 -TagName "v$version" | Out-Null

      - name: Test staged DLL workflow
        shell: pwsh
        run: ./scripts/test-staged-dll-workflow.ps1

      - name: Test updater rollback
        shell: pwsh
        run: ./scripts/test-updater-rollback.ps1

      - name: Build and verify release payload
        shell: pwsh
        run: ./scripts/build-and-verify-release.ps1

      - name: Upload main build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: longyin-main-${{ github.sha }}
          path: |
            electron-app/release/LongYinProMaxApp-*-win-x64.zip
            electron-app/release/update-manifest.json
          if-no-files-found: error
          retention-days: 7
