## Settings file was created by plugin LongYin Pro Max v1.35.0
## Plugin GUID: codex.longyin.staminalock

[Battle]

## Multiplies the selected in-battle speed option.
# Setting type: Int32
# Default value: 2
SpeedMultiplier = 2

## Multiplies martial-skill EXP gained from battle actions for every combatant, including enemies.
# Setting type: Int32
# Default value: 1
SkillExpMultiplier = 1

[CharacterCreation]

## Multiplies the remaining point pools during character creation.
# Setting type: Int32
# Default value: 1
PointMultiplier = 3

[Auction]

## Adds a free unlimited refresh button to the auction exhibit preview window.
# Setting type: Boolean
# Default value: true
PreviewRefreshEnabled = true

## Single-key shortcut for free refresh while the auction exhibit preview window is visible.
# Setting type: KeyCode
# Default value: R
PreviewRefreshHotkey = R

## When true, the 拍卖大会 world event is generated at difficulty 10, the red highest event grade, including its grade-dependent auction content.
# Setting type: Boolean
# Default value: true
EventAlwaysRedEnabled = true

[GovernmentStorage]

## Adds a refresh button to the government storage page.
# Setting type: Boolean
# Default value: true
RefreshEnabled = true

## Single-key shortcut that refreshes items only while the government storage page is visible.
# Setting type: KeyCode
# Default value: R
RefreshHotkey = R

[Commerce]

## Minimum cash carried by NPC shop merchants while a Shop trade window is open. Set to 0 to disable.
# Setting type: Int32
# Default value: 100000
MerchantCarryCash = 100000

## Shows a treasure-cart summary with item count, purchase cost, expected resale value, and projected profit.
# Setting type: Boolean
# Default value: true
TreasureTradeHelperEnabled = true

## Automatically adds unidentified treasures estimated profitable from the player-appraised parenthesized value when a trade shop opens.
# Setting type: Boolean
# Default value: true
TreasureAutoTradeEnabled = true

## Adds the in-shop material sweep button and its rarity and quality filters.
# Setting type: Boolean
# Default value: true
MaterialAutoBuyEnabled = true

## Minimum material rarity tier for the in-shop material sweep button. Values are clamped to 0-5.
# Setting type: Int32
# Default value: 0
MaterialPurchaseMinRareLv = 0

## Minimum material item-quality tier for the in-shop material sweep button. Values are clamped to 0-5.
# Setting type: Int32
# Default value: 0
MaterialPurchaseMinItemLv = 0

## When true, material sweep also applies the configured in-game affix rules.
# Setting type: Boolean
# Default value: false
MaterialAffixFilterEnabled = false

## How material affix rules combine: All requires every rule; Any requires at least one rule.
# Setting type: MaterialAffixCombineMode
# Default value: All
MaterialAffixFilterCombineMode = All

## JSON rules edited from the in-game material affix filter window.
# Setting type: String
# Default value: []
MaterialAffixFilterRulesJson = []

## Shows the shop ownership overlay and enables buying out the current shop.
# Setting type: Boolean
# Default value: true
ShopOwnershipEnabled = true

