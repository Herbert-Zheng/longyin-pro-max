name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source and version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/assert-release-source.ps1 -TagName $env:RELEASE_TAG

      - name: Verify release notes policy
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/test-release-notes-policy.ps1
          ./scripts/get-release-notes.ps1 -TagName $env:RELEASE_TAG | Out-Null

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 6.0.428

      - name: Install Electron dependencies
        working-directory: electron-app
        run: npm ci

      - name: Run release tests
        working-directory: electron-app
        run: |
          npm run typecheck
          npm run test:backend
          npm run test:renderer-smoke:harness

      - name: Test staged DLL workflow
        shell: pwsh
        run: ./scripts/test-staged-dll-workflow.ps1

      - name: Test updater rollback
        shell: pwsh
        run: ./scripts/test-updater-rollback.ps1

      - name: Build and verify release payload
        shell: pwsh
        run: ./scripts/build-and-verify-release.ps1

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            electron-app/release/LongYinProMaxSetup-*-win-x64.exe
            electron-app/release/LongYinProMaxApp-*-win-x64.zip
            electron-app/release/update-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Verify GitHub CLI availability
        shell: pwsh
        run: gh --version

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-release-assets.ps1 -TagName $env:RELEASE_TAG -AssetsRoot ./release-assets

      - name: Download and smoke-test published Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-published-release.ps1 -TagName $env:RELEASE_TAG
